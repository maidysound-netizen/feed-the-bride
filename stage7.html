    button:hover:not(:disabled){filter:brightness(1.2);transform:translateY(-1px)}
    .scanline{position:fixed;inset:0;pointer-events:none;z-index:9998;opacity:0.03;background-image:repeating-linear-gradient(0deg,transparent,transparent 2px,#ffd700 2px,#ffd700 3px)}

    @keyframes holyGlow{0%,100%{opacity:0.6}50%{opacity:1}}
    #s7-intro{position:fixed;inset:0;z-index:9999;background:#000;display:none;flex-direction:column;align-items:center;justify-content:center;}
    #s7-narration{font-style:italic;font-size:1rem;line-height:2;text-align:center;max-width:380px;padding:24px;color:#e8dcc8;opacity:0;transition:opacity 1.5s}
    #event-overlay{display:none;position:fixed;inset:0;z-index:800;background:#000}
    #event-overlay video{width:100%;height:100%;object-fit:cover}
    #event-skip{position:absolute;bottom:28px;right:28px;background:rgba(0,0,0,0.6);color:#ffd700;border:1px solid #ffd70055;border-radius:4px;padding:8px 20px;cursor:pointer;font-size:0.75rem;letter-spacing:2px}
    #gameover{display:none;position:fixed;inset:0;z-index:700;background:rgba(0,0,0,0.98);flex-direction:column;align-items:center;justify-content:center;gap:16px}
    #ending{display:none;position:fixed;inset:0;z-index:900;background:#000;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-family:Georgia,serif;}
    .wrap{max-width:480px;margin:0 auto;padding:16px}
    .section-label{font-size:0.7rem;letter-spacing:2px;margin-bottom:8px;color:#ffd700}
    .food-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .food-btn{padding:10px 8px;border-radius:8px;text-align:left;border:1px solid;cursor:pointer}
    .upgrade-list{display:flex;flex-direction:column;gap:6px}
    .upgrade-btn{padding:10px 12px;border-radius:8px;border:1px solid;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
    #log-box{background:rgba(10,8,0,0.8);border:1px solid rgba(255,215,0,0.15);border-radius:8px;padding:10px 12px;max-height:150px;overflow-y:auto}

    {id:'lotus',      name:'黄金蓮の薬飯',               cost:30000, hunger:-65,emoji:'🪷',quote:'合理的だ。',                   fedW:1},
    {id:'dimension',  name:'次元エネルギー原液',         cost:35000, hunger:-70,emoji:'🌀',quote:'…これだ。',                    fedW:1},
    {id:'mantra',     name:'マントラ濃縮エキス',         cost:28000, hunger:-62,emoji:'🔔',quote:'体から音が出る。',               fedW:1},
    {id:'void',       name:'虚空結晶栄養剤',             cost:40000, hunger:-72,emoji:'🕳️',quote:'…あるのにない。',            fedW:1},
    {id:'holy',       name:'聖霊エネルギードリンク',     cost:45000, hunger:-75,emoji:'✝️',quote:'熱い。',                       fedW:1},
    {id:'nirvana',    name:'涅槃特別食',                 cost:50000, hunger:-80,emoji:'☸️',quote:'…これはYesだ。',               fedW:2,special:'nirvana'},
    {id:'godmeal',    name:'神の弁当',                   cost:80000, hunger:-90,emoji:'👑',quote:'「…これで解脱できる。」',       fedW:2,special:'godmeal'},
    {id:'universe',   name:'宇宙圧縮饗宴',               cost:100000,hunger:-95,emoji:'🌌',quote:'「…次元が開く。」',             fedW:3,special:'universe'},
  ],
};

var UPGRADES=[
  {id:'meditation', name:{kr:'명상 수행비',             en:'Meditation Fund',          jp:'瞑想修行費'},             cost:50000,  incomeBonus:500,  desc:{kr:'+500원/초',  en:'+500 won/sec', jp:'+500円/秒'}},
  {id:'dharma',     name:{kr:'법계 특허 출원',           en:'Dharma Patent',            jp:'法界特許出願'},           cost:150000, incomeBonus:1500, desc:{kr:'+1500원/초', en:'+1500 won/sec',jp:'+1500円/秒'}},
  {id:'godtech',    name:{kr:'신계 기술 중개료',         en:'Divine Tech Brokerage',    jp:'神界技術仲介料'},         cost:400000, incomeBonus:4000, desc:{kr:'+4000원/초', en:'+4000 won/sec',jp:'+4000円/秒'}},
  {id:'auto_dim1',  name:{kr:'차원 급식 시스템 Lv1',    en:'Dimensional Feeder Lv1',   jp:'次元給食システムLv1'},    cost:80000,  autoFeed:'starlight',autoInterval:20000,desc:{kr:'20초마다 별빛',en:'Starlight/20s',jp:'20秒ごと星光'}},
  {id:'auto_dim2',  name:{kr:'차원 급식 시스템 Lv2',    en:'Dimensional Feeder Lv2',   jp:'次元給食システムLv2'},    cost:200000, autoFeed:'nirvana', autoInterval:15000,desc:{kr:'15초마다 열반식',en:'Nirvana/15s',jp:'15秒ごと涅槃'}},
  {id:'auto_dim3',  name:{kr:'차원 급식 시스템 Lv3',    en:'Dimensional Feeder Lv3',   jp:'次元給食システムLv3'},    cost:500000, autoFeed:'godmeal', autoInterval:10000,desc:{kr:'10초마다 신의 도시락',en:'God meal/10s',jp:'10秒ごと神弁当'}},
];

var G={
  lang:lsGet(LS.lang,'kr'),money:lsGet(LS.money,10),income:lsGet(LS.income,2),
  upgrades:lsGet(LS.upgrades,{}),fedCount:lsGet(LS.fedCount,0),totalEarned:lsGet(LS.totalEarned,0),
  hunger:50,gameOver:false,lastMysteryAt:-1,logs:[],autoTimers:{},
};

function L(k){return LD[G.lang][k];}
function loc(o){return typeof o==='object'?(o[G.lang]||o.kr):o;}
function getFoods(){return FOODS[G.lang]||FOODS.kr;}
function getBrideState(){var s=L('brideStates'),c=s[0];for(var i=0;i<s.length;i++){if(G.hunger>=s[i].t)c=s[i];}return c;}
function addLog(t){G.logs.push(t);if(G.logs.length>50)G.logs.shift();renderLog();}

function showEnding(){
  var d=LD[G.lang];
  var endingEl=document.getElementById('ending');
  var textEl=document.getElementById('ending-text');
  endingEl.style.display='flex';
  bgm.pause();
  showEvent('videos/s7_ending.mp4');
  setTimeout(function(){
    var lines=[d.ending1,d.ending2,d.ending3];
    var i=0;
    function showNext(){
      if(i>=lines.length)return;
      var line=document.createElement('div');
      line.style.cssText='color:'+(i===0?'#ffd700':i===1?'#ffffff':'#887a40')+';font-size:'+(i===0?'1.5rem':i===1?'1rem':'0.85rem')+';opacity:0;transition:opacity 1s;font-style:'+(i===2?'italic':'normal')+';';
      line.textContent=lines[i];
      textEl.appendChild(line);
      setTimeout(function(){line.style.opacity='1';},100);
      i++;
      setTimeout(showNext,2500);
    }
    showNext();
  },3000);
}

function feedFood(food){
  if(G.gameOver)return;
  var d=LD[G.lang];
  if(G.money<food.cost){addLog(d.noMoney(food.name,food.cost));return;}
  G.money=parseFloat((G.money-food.cost).toFixed(1));
  G.fedCount=parseFloat((G.fedCount+(food.fedW||1)).toFixed(1));
  G.hunger=parseFloat(Math.max(0,G.hunger+food.hunger).toFixed(1));
  addLog(d.feedLog(food.emoji,food.name,food.quote));
  if(food.special==='nirvana'){setTimeout(function(){addLog({kr:'☸️ 열반 에너지... 차원이 흔들린다.',en:'☸️ Nirvana energy... dimensions trembling.',jp:'☸️ 涅槃エネルギー…次元が揺れる。'}[G.lang]);},800);}
  if(food.special==='godmeal'){setTimeout(function(){addLog({kr:'👑 \"...신의 맛이다.\"',en:'👑 \"...Tastes divine.\"',jp:'👑 「…神の味だ。」'}[G.lang]);showEvent('videos/s7_event_godmeal.mp4');},800);}
  if(food.special==='universe'){setTimeout(function(){addLog({kr:'🌌 차원의 문이 열리기 시작했다.',en:'🌌 The dimensional gate begins to open.',jp:'🌌 次元の門が開き始めた。'}[G.lang]);showEvent('videos/s7_event_universe.mp4');},800);}
  var fedInt=Math.floor(G.fedCount);
  var mystery=L('mystery');
  if(mystery[fedInt]&&G.lastMysteryAt!==fedInt){G.lastMysteryAt=fedInt;addLog('신부: '+mystery[fedInt]);}
  if(G.fedCount>=2500){showEnding();return;}
  lsSave();renderBride();renderStats();renderFoods();renderUpgrades();
}

function buyUpgrade(up){
  if(G.gameOver||G.upgrades[up.id])return;
  var d=LD[G.lang];var name=loc(up.name);
  if(G.money<up.cost){addLog(d.noUpg(up.cost));return;}
  G.money=parseFloat((G.money-up.cost).toFixed(1));
  G.upgrades[up.id]=true;
  if(up.incomeBonus){G.income=parseFloat((G.income+up.incomeBonus).toFixed(1));addLog(d.buyUpg(name,up.incomeBonus));}
  if(up.autoFeed){
    var foods=getFoods();var food=null;
    for(var i=0;i<foods.length;i++){if(foods[i].id===up.autoFeed){food=foods[i];break;}}
    if(food){(function(f){G.autoTimers[up.id]=setInterval(function(){feedFood(f);},up.autoInterval);})(food);addLog(d.autoStart(name,food.name));}
  }
  lsSave();renderStats();renderUpgrades();
}

function gameLoop(){
  if(G.gameOver)return;
  G.money=parseFloat((G.money+G.income).toFixed(1));
  G.totalEarned=parseFloat((G.totalEarned+G.income).toFixed(1));
  var rate=6.5;
  G.hunger=parseFloat(Math.min(100,G.hunger+rate).toFixed(1));
  if(G.hunger>=100){G.gameOver=true;showEvent('videos/event_gameover.mp4');renderGameOver();return;}
  lsSave();renderStats();renderBride();renderUpgrades();
}

function randomLog(){
  if(G.gameOver)return;
  var logs=L('randLogs');
  var pool=G.hunger<40?logs.early:G.hunger<65?logs.mid:G.hunger<80?logs.danger:logs.critical;
  addLog(pool[Math.floor(Math.random()*pool.length)]);
}

function restartGame(){
  Object.keys(G.autoTimers).forEach(function(k){clearInterval(G.autoTimers[k]);});
  G.money=10;G.income=2;G.fedCount=0;G.totalEarned=0;
  G.upgrades={};G.autoTimers={};G.hunger=50;G.gameOver=false;
  lsSet('ftb_stage',1);lsSave();window.location.href='index.html';
}

function playVideo(src,onDone){
  var done=false;
  function finish(){if(done)return;done=true;closeEvent();onDone();}
  eventVid.onended=finish;eventVid.onerror=finish;
  eventVid.src=BASE+src;eventOverlay.style.display='block';
  eventVid.play().catch(function(){finish();});
  setTimeout(function(){finish();},30000);
}

function playNarration(cb){
  var introEl=document.getElementById('s7-intro');
  var narEl=document.getElementById('s7-narration');
  var d=LD[G.lang];
  introEl.style.display='flex';introEl.style.background='#000';
  narEl.style.opacity='0';narEl.style.color='#e8dcc8';
  var lines=d.narration.split('\n');
  narEl.innerHTML=lines.map(function(l){return '<div>'+l+'</div>';}).join('');
  document.body.style.animation='shake 0.6s ease';
  setTimeout(function(){document.body.style.animation='';},600);
  setTimeout(function(){narEl.style.opacity='1';},300);
  setTimeout(function(){introEl.style.background='rgba(0,0,0,0.97)';narEl.style.color='#ffd700';},1800);
  setTimeout(function(){narEl.innerHTML+='<div style="margin-top:20px;color:#ffffff;font-size:1.1rem;font-style:normal;font-weight:bold;">'+d.quote+'</div>';},3000);
  setTimeout(function(){
    introEl.style.transition='opacity 1s';introEl.style.opacity='0';
    setTimeout(function(){introEl.style.display='none';introEl.style.opacity='1';introEl.style.transition='';cb();},1000);
  },5000);
}

function playIntro(cb){
  playVideo('videos/s7_intro.mp4',function(){
    playNarration(function(){
      playVideo('videos/s7_outro.mp4',function(){cb();});
    });
  });
}

function renderAll(){renderLangTabs();renderHeader();renderBride();renderStats();renderFoods();renderUpgrades();renderLog();renderGameOver();}

function renderLangTabs(){
  var el=document.getElementById('lang-tabs');el.innerHTML='';
  ['kr','en','jp'].forEach(function(lang){
    var btn=document.createElement('button');btn.textContent=LD[lang].tab;
    var a=lang===G.lang;
    btn.style.cssText='flex:1;padding:8px;background:'+(a?'rgba(255,215,0,0.1)':'transparent')+';border:'+(a?'1px solid #ffd70044':'1px solid transparent')+';border-radius:6px;color:'+(a?'#ffd700':'#443d20')+';cursor:pointer;font-size:0.8rem;font-family:Georgia,serif;';
    btn.addEventListener('click',function(){G.lang=lang;lsSet(LS.lang,lang);renderAll();});
    el.appendChild(btn);
  });
}

function renderHeader(){
  var d=LD[G.lang];
  document.getElementById('header').innerHTML=
    '<div style="font-size:0.65rem;letter-spacing:5px;color:#ffd700;margin-bottom:4px;animation:holyGlow 2s infinite;">KING OF WANDS BRIDE — STAGE 7</div>'+
    '<div style="font-size:1.3rem;color:#ffd700;letter-spacing:1px;text-shadow:0 0 12px #ffd70066;">'+d.title+'</div>'+
    '<div style="font-size:0.6rem;color:#443d20;margin-top:2px;">'+d.subtitle+'</div>';
}

function renderBride(){
  var el=document.getElementById('bride-panel');
  var state=getBrideState();var oe=Math.round(G.hunger);
  var barColor=G.hunger<40?'#ffd700':G.hunger<70?'#ff8800':'#ff0000';
  el.style.border='1px solid '+state.c+'44';
  el.innerHTML=
    '<div style="font-size:3.5rem;line-height:1;margin-bottom:8px;filter:drop-shadow(0 0 14px '+state.c+')">'+state.e+'</div>'+
    '<div style="font-size:0.85rem;color:'+state.c+';margin-bottom:6px;letter-spacing:1px;">'+state.s+'</div>'+
    '<div style="font-size:0.6rem;color:#ffd70022;margin-bottom:10px;letter-spacing:2px;">'+L('heightLabel')+'</div>'+
    '<div style="display:flex;justify-content:space-between;font-size:0.7rem;color:#443d20;margin-bottom:4px;"><span>'+L('hunger')+'</span><span style="color:'+(G.hunger>70?'#ff0000':'#ffd700')+'">'+oe+'%</span></div>'+
    '<div style="height:8px;background:rgba(255,215,0,0.05);border-radius:4px;overflow:hidden;"><div style="height:100%;width:'+oe+'%;background:'+barColor+';border-radius:4px;transition:width 0.4s,background 0.4s;box-shadow:0 0 6px '+barColor+';"></div></div>'+
    '<div style="margin-top:8px;font-size:0.62rem;color:#443d20;">대접 '+G.fedCount+'회 | 엔딩: 2500회</div>';
}

function renderStats(){
  var d=LD[G.lang];
  document.getElementById('stats').innerHTML=
    '<div style="display:flex;justify-content:space-around;">'+
    [{label:d.funds,val:'💰 '+G.money.toFixed(1)+d.unit,color:'#ffd700'},
     {label:d.income,val:'📈 '+G.income+d.perSec,color:'#ccaa00'},
     {label:d.fed,val:'🍽 '+G.fedCount,color:'#ffffff'}]
    .map(function(s){return '<div style="text-align:center;"><div style="font-size:0.65rem;color:#443d20;">'+s.label+'</div><div style="font-size:0.95rem;color:'+s.color+';">'+s.val+'</div></div>';})
    .join('')+'</div>';
}

function renderFoods(){
  var labelEl=document.getElementById('food-label');
  var gridEl=document.getElementById('food-grid');
  var d=LD[G.lang];
  labelEl.textContent=d.foodSec;gridEl.innerHTML='';
  getFoods().forEach(function(food){
    var canAfford=G.money>=food.cost;
    var btn=document.createElement('button');btn.className='food-btn';
    btn.style.cssText='background:'+(canAfford?'rgba(255,215,0,0.04)':'rgba(0,0,0,0.3)')+';border-color:'+(canAfford?'rgba(255,215,0,0.2)':'rgba(30,20,0,0.3)')+';color:'+(canAfford?'#e8dcc8':'#443d20')+';opacity:'+(canAfford?'1':'0.45')+';cursor:'+(canAfford&&!G.gameOver?'pointer':'not-allowed')+';';
    if(G.gameOver)btn.disabled=true;
    btn.innerHTML='<div style="font-size:1.3rem;">'+food.emoji+'</div><div style="font-weight:bold;margin-top:2px;font-size:0.75rem;">'+food.name+'</div><div style="font-size:0.65rem;color:#ffd70022;">'+food.cost+d.unit+' | '+Math.abs(food.hunger)+'%↓</div>';
    btn.addEventListener('click',function(){feedFood(food);});
    gridEl.appendChild(btn);
  });
}

function renderUpgrades(){
  var labelEl=document.getElementById('upgrade-label');
  var listEl=document.getElementById('upgrade-list');
  var d=LD[G.lang];
  labelEl.textContent=d.upgSec;listEl.innerHTML='';
  UPGRADES.forEach(function(up){
    var owned=!!G.upgrades[up.id];var canBuy=!owned&&G.money>=up.cost&&!G.gameOver;
    var btn=document.createElement('button');btn.className='upgrade-btn';
    btn.style.cssText='background:'+(owned?'rgba(255,215,0,0.08)':canBuy?'rgba(255,215,0,0.02)':'rgba(0,0,0,0.3)')+';border-color:'+(owned?'rgba(255,215,0,0.4)':canBuy?'rgba(255,215,0,0.15)':'rgba(30,20,0,0.3)')+';color:'+(owned?'#ffd700':canBuy?'#e8dcc8':'#443d20')+';cursor:'+(canBuy?'pointer':'not-allowed')+';width:100%;';
    if(!canBuy)btn.disabled=true;
    btn.innerHTML='<div style="text-align:left;"><div style="font-weight:bold;">'+(owned?'✓ ':'')+loc(up.name)+'</div><div style="font-size:0.65rem;color:'+(owned?'#ccaa00':'#443d20')+';">'+loc(up.desc)+'</div></div>'+(!owned?'<div style="font-size:0.75rem;color:#ffd70044;">'+up.cost+d.unit+'</div>':'');
    btn.addEventListener('click',function(){buyUpgrade(up);});
    listEl.appendChild(btn);
  });
}

function renderLog(){
  var d=LD[G.lang];
  document.getElementById('log-label').textContent=d.logSec;
  var entriesEl=document.getElementById('log-entries');
  entriesEl.innerHTML=G.logs.map(function(log,i){
    var isLast=i===G.logs.length-1;
    return '<div style="font-size:0.72rem;color:'+(isLast?'#ffd700':'#443d20')+';margin-bottom:2px;">'+log+'</div>';
  }).join('');
  document.getElementById('log-box').scrollTop=9999;
}

function renderGameOver(){
  var el=document.getElementById('gameover');var d=LD[G.lang];
  if(G.gameOver){
    el.style.display='flex';
    document.getElementById('go-title').textContent=d.goTitle;
    document.getElementById('go-sub').textContent=d.goSub;
    document.getElementById('go-stats').textContent=d.goStats(G.totalEarned.toFixed(0),G.fedCount);
    document.getElementById('go-restart').textContent=d.restart;
    document.getElementById('go-continue').textContent=d.continueGame;
  }else{el.style.display='none';}
}

document.getElementById('go-restart').addEventListener('click',restartGame);
document.getElementById('go-continue').addEventListener('click',function(){
  Object.keys(G.autoTimers).forEach(function(k){clearInterval(G.autoTimers[k]);});
  G.autoTimers={};G.upgrades={};G.hunger=25;G.gameOver=false;
  G.logs=[LD[G.lang].restartLog[0]];
  lsSave();renderAll();
  setInterval(gameLoop,1000);setInterval(randomLog,9000);
});

playIntro(function(){
  G.hunger=25;
  G.logs=[L('s7enter'),LD[G.lang].quote];
  renderAll();
  setInterval(gameLoop,1000);
  setInterval(randomLog,9000);
});

})();
</script>
</body>
</html>
